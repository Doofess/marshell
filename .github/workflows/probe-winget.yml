# TEMPORARY, never merged: runs the fixed scripts/release/smoke.ps1 (branch winget-check-smartscreen) in
# winget mode against the published v0.1.0-alpha.1, the way winget-check does after a release.
name: probe-winget

on:
  pull_request:
    paths:
      - .github/workflows/probe-winget.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: v0.1.0-alpha.1
      VERSION: 0.1.0-alpha.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winget-check-smartscreen
          persist-credentials: false
      - name: The fixture the release's build made
        shell: pwsh
        run: |
          gh run download 43942007171 --repo $env:GITHUB_REPOSITORY --name release --dir out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out | ForEach-Object { Write-Host "PROBE out/$($_.Name) $($_.Length) bytes" }
      - name: winget and the manifest folder
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser
            Repair-WinGetPackageManager -Latest -Force
          }
          winget --version
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "winget-manifest-${env:VERSION}.zip" --dir fallback
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "fallback/winget-manifest-${env:VERSION}.zip" -DestinationPath fallback/manifest
          winget settings --enable LocalManifestFiles
          winget validate --manifest fallback/manifest --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test with winget
        timeout-minutes: 20
        shell: pwsh
        run: |
          $how = @{ WingetManifest = 'fallback/manifest' }
          if (Test-Path out/smoke-fixture.exe) { $how.Fixture = 'out/smoke-fixture.exe' }
          ./scripts/release/smoke.ps1 -Version $env:VERSION @how
