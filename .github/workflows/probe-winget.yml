# TEMPORARY, never merged: finds out why `winget install --manifest` did not return in winget-check
# for v0.1.0-alpha.1 (run 43942007171). Runs only on this branch's own pull request.
name: probe-winget

on:
  pull_request:
    paths:
      - .github/workflows/probe-winget.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [nozonechecks, policy]
    env:
      VARIANT: ${{ matrix.variant }}
      TAG: v0.1.0-alpha.1
      VERSION: 0.1.0-alpha.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: winget and the manifest folder
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host 'PROBE winget was not on PATH; installing it'
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser
            Repair-WinGetPackageManager -Latest -Force
          }
          winget --info
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "winget-manifest-${env:VERSION}.zip" --dir fallback
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "fallback/winget-manifest-${env:VERSION}.zip" -DestinationPath fallback/manifest
          Get-ChildItem fallback/manifest -Recurse -File | ForEach-Object { Write-Host "PROBE manifest file $($_.FullName)"; Get-Content $_.FullName | Write-Host }
          winget settings --enable LocalManifestFiles
          winget validate --manifest fallback/manifest --disable-interactivity
          Write-Host "PROBE session $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive $([Environment]::UserInteractive), user $(whoami)"
      - name: Install with winget, bounded, and look at what is waiting
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Add-Type @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class ProbeWin {
              delegate bool EnumProc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              public static List<string> Visible() {
                  var r = new List<string>();
                  EnumWindows((h, l) => {
                      if (IsWindowVisible(h)) {
                          var t = new StringBuilder(512); GetWindowText(h, t, 512);
                          var c = new StringBuilder(256); GetClassName(h, c, 256);
                          uint pid; GetWindowThreadProcessId(h, out pid);
                          r.Add(pid + "\t" + c + "\t" + t);
                      }
                      return true;
                  }, IntPtr.Zero);
                  return r;
              }
          }
          '@
          function Show-State([string]$When) {
              Write-Host "PROBE ---- $When"
              $all = Get-CimInstance Win32_Process
              $names = @{}; foreach ($p in $all) { $names[[int]$p.ProcessId] = $p.Name }
              $want = 'winget|WindowsPackageManager|AppInstaller|Marshell|marshell|setup|nsis|~nsu|consent|smartscreen|msedgewebview2|OpenWith|rundll32|dllhost|conhost|WerFault|msiexec|cmd\.exe|powershell|pwsh'
              foreach ($p in ($all | Where-Object { $_.Name -match $want -or ($_.CommandLine -and $_.CommandLine -match 'Marshell|WinGet') } | Sort-Object ProcessId)) {
                  $cl = if ($p.CommandLine) { $p.CommandLine } else { '' }
                  if ($cl.Length -gt 300) { $cl = $cl.Substring(0, 300) }
                  Write-Host ("PROBE proc {0} parent {1} ({2}) {3} | {4}" -f $p.ProcessId, $p.ParentProcessId, $names[[int]$p.ParentProcessId], $p.Name, $cl)
              }
              foreach ($w in [ProbeWin]::Visible()) {
                  $parts = $w -split "`t"
                  Write-Host ("PROBE window pid {0} ({1}) class '{2}' title '{3}'" -f $parts[0], $names[[int]$parts[0]], $parts[1], $parts[2])
              }
              $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Marshell'
              Write-Host "PROBE uninstall key present: $(Test-Path -LiteralPath $key)"
          }
          function Save-Screen([string]$Name) {
              try {
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
                  $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                  $g = [System.Drawing.Graphics]::FromImage($bmp)
                  $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
                  $bmp.Save((Join-Path (Resolve-Path probe) $Name)); $g.Dispose(); $bmp.Dispose()
                  Write-Host "PROBE screenshot $Name saved ($($b.Width)x$($b.Height))"
              } catch { Write-Host "PROBE screenshot failed: $($_.Exception.Message)" }
          }

          if ($env:VARIANT -eq 'nozonechecks') {
              $env:SEE_MASK_NOZONECHECKS = '1'
              Write-Host 'PROBE variant: SEE_MASK_NOZONECHECKS=1 in the environment'
          }
          if ($env:VARIANT -eq 'policy') {
              New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Force | Out-Null
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Name EnableSmartScreen -Value 0 -Type DWord
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' -Name SmartScreenEnabled -Value 'Off' -Type String
              Get-Process smartscreen -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Write-Host 'PROBE variant: SmartScreen for apps and files turned off by policy (EnableSmartScreen=0, SmartScreenEnabled=Off)'
          }
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Marshell'
          Show-State 'before'
          $manifest = (Resolve-Path fallback/manifest).Path
          $argLine = "install --manifest `"$manifest`" --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --verbose-logs"
          Write-Host "PROBE starting: winget $argLine"
          $out = Join-Path (Resolve-Path probe) 'winget-out.txt'
          $err = Join-Path (Resolve-Path probe) 'winget-err.txt'
          $p = Start-Process -FilePath winget -ArgumentList $argLine -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow
          $null = $p.Handle
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $shot = 0
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 240) {
              Start-Sleep -Seconds 20
              Show-State ("{0:n0} s after the start, winget exited: {1}" -f $sw.Elapsed.TotalSeconds, $p.HasExited)
              if ($shot -lt 3) { $shot++; Save-Screen "screen-$shot.png" }
          }
          if ($p.HasExited) {
              Write-Host ("PROBE winget exited with {0} after {1:n0} s" -f $p.ExitCode, $sw.Elapsed.TotalSeconds)
          } else {
              Write-Host 'PROBE winget was still running after 240 s'
              Save-Screen 'screen-at-limit.png'
          }
          Start-Sleep -Seconds 5
          Show-State 'after'
          if ($p.HasExited -and (Test-Path -LiteralPath $uninstKey)) {
              $k = Get-ItemProperty -LiteralPath $uninstKey
              Write-Host "PROBE installed: DisplayVersion $($k.DisplayVersion), InstallLocation $($k.InstallLocation)"
              $uout = Join-Path (Resolve-Path probe) 'winget-uninstall-out.txt'
              $uerr = Join-Path (Resolve-Path probe) 'winget-uninstall-err.txt'
              $uargs = "uninstall --manifest `"$manifest`" --silent --disable-interactivity --verbose-logs"
              Write-Host "PROBE starting: winget $uargs"
              $u = Start-Process -FilePath winget -ArgumentList $uargs -PassThru -RedirectStandardOutput $uout -RedirectStandardError $uerr -NoNewWindow
              $null = $u.Handle
              if ($u.WaitForExit(180000)) { Write-Host "PROBE winget uninstall exited with $($u.ExitCode)" } else { Write-Host 'PROBE winget uninstall was still running after 180 s' }
              $usw = [System.Diagnostics.Stopwatch]::StartNew()
              while ((Test-Path -LiteralPath $uninstKey) -and $usw.Elapsed.TotalSeconds -lt 120) { Start-Sleep -Seconds 2 }
              Write-Host ("PROBE uninstall key gone: {0} after {1:n0} s" -f (-not (Test-Path -LiteralPath $uninstKey)), $usw.Elapsed.TotalSeconds)
              Show-State 'after the uninstall'
              Write-Host 'PROBE ---- winget uninstall stdout'; if (Test-Path $uout) { Get-Content $uout | Where-Object { $_.Trim() } | Select-Object -Last 20 | Write-Host }
          }
          Write-Host 'PROBE ---- winget stdout'; if (Test-Path $out) { Get-Content $out | Where-Object { $_.Trim() } | Select-Object -Last 60 | Write-Host }
          Write-Host 'PROBE ---- winget stderr'; if (Test-Path $err) { Get-Content $err | Select-Object -Last 30 | Write-Host }
          $diag = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
          Write-Host "PROBE ---- winget logs in $diag (present: $(Test-Path $diag))"
          if (Test-Path $diag) {
              Get-ChildItem $diag -File | Sort-Object LastWriteTime | ForEach-Object {
                  Copy-Item $_.FullName (Join-Path (Resolve-Path probe) $_.Name) -ErrorAction SilentlyContinue
                  Write-Host "PROBE log $($_.Name) $($_.Length) bytes"
              }
              $last = Get-ChildItem $diag -File -Filter 'WinGet-*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
              if ($last) { Write-Host "PROBE ---- tail of $($last.Name)"; Get-Content $last.FullName | Select-Object -Last 80 | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) } else { $_ } } | Write-Host }
          }
          Get-ChildItem (Join-Path $env:TEMP 'WinGet') -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $zone = Get-Content -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue
              Write-Host "PROBE downloaded $($_.FullName) $($_.Length) bytes; zone: $($zone -join ' ')"
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.variant }}
          path: probe
          if-no-files-found: ignore
