[package]
name = "marshell-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
marshell-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
portable-pty = "0.9"
vt100 = "0.16"
getrandom = "0.4"
hex = "0.4.3"
dirs = "7.0.0"
futures-util = "0.3.34"
tracing = "0.1.44"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
notify = "8"
diffy = "0.5"
sha2 = "0.10"
zstd = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dev-dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
ureq = { version = "3.4.2", features = ["json"] }
